name: Checks and release

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  # All registries trust this workflow for automatic and manual releases.
  workflow_dispatch:
    inputs:
      release_mode:
        description: "Manual release mode"
        required: true
        type: choice
        default: "instant"
        options:
          - instant
          - changeset-pr
      bump_type:
        description: "Manual release type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      description:
        description: "Manual release description (optional)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Changeset check - only runs on PRs
  changeset-check:
    name: Check for Changesets
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: npm install

      - name: Check for changesets
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Skip changeset check for automated version PRs
          if [[ "$HEAD_REF" == "changeset-release/"* ]]; then
            echo "Skipping changeset check for automated release PR"
            exit 0
          fi

          # Run changeset validation script
          node scripts/validate-changeset.mjs

  # Linting and formatting - runs after changeset check on PRs, immediately on main
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    needs: [changeset-check]
    if: always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_mode == 'instant' && github.ref == 'refs/heads/main') || needs.changeset-check.result == 'success')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Install Node dependencies
        run: npm install

      - name: Check formatting
        run: npm run format:check

      - name: Test release tooling
        run: npm run test:release

      - name: Check file size limit
        run: npm run check:file-size

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          cd python
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python linting (ruff)
        run: cd python && ruff check src/

  # Test matrix for JavaScript and Python
  test-js:
    name: Test JavaScript (${{ matrix.runtime }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [changeset-check]
    if: always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_mode == 'instant' && github.ref == 'refs/heads/main') || needs.changeset-check.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        runtime: [node, bun]
    defaults:
      run:
        working-directory: js

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies (Node.js)
        if: matrix.runtime == 'node'
        run: npm install

      - name: Run tests (Node.js)
        if: matrix.runtime == 'node'
        run: npm test

      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (Bun)
        if: matrix.runtime == 'bun'
        run: bun install

      - name: Run tests (Bun)
        if: matrix.runtime == 'bun'
        run: bun test

  test-python:
    name: Test Python (${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [changeset-check]
    if: always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_mode == 'instant' && github.ref == 'refs/heads/main') || needs.changeset-check.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.13"]
    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

      - name: Run linting (ruff)
        run: ruff check src/

      - name: Build and validate Python distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python ../experiments/check-python-distributions.py

  test-rust:
    name: Test Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [changeset-check]
    if: always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_mode == 'instant' && github.ref == 'refs/heads/main') || needs.changeset-check.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check formatting
        run: cargo fmt --check

      - name: Run linting (clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Check the package
        run: cargo package --allow-dirty

  # Version once after validation, then publish each registry independently.
  release:
    name: Prepare release
    needs: [lint, test-js, test-python, test-rust]
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_mode == 'instant')) && needs.lint.result == 'success' && needs.test-js.result == 'success' && needs.test-python.result == 'success' && needs.test-rust.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Version packages and commit to main
        id: version
        env:
          RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_mode || 'changeset' }}
          BUMP_TYPE: ${{ inputs.bump_type }}
          DESCRIPTION: ${{ inputs.description }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Reuse this run's release commit on a rerun, including instant releases.
          RELEASE_COMMIT=$(git log --format=%H --grep="^Release-Run: $GITHUB_RUN_ID$" -1)
          if [[ -n "$RELEASE_COMMIT" ]]; then
            git checkout "$RELEASE_COMMIT"
          else
            if [[ $(git rev-parse HEAD) != "$SOURCE_SHA" ]]; then
              echo "main advanced after validation; its newer workflow run must prepare the release"
              exit 1
            fi
            if [[ "$RELEASE_MODE" == "instant" ]]; then
              node scripts/instant-version-bump.mjs --bump-type "$BUMP_TYPE" --description "$DESCRIPTION"
            else
              # No changesets means keep the current version and retry missing registries.
              BUMP_TYPE= node scripts/version-packages.mjs
            fi
            NEW_VERSION=$(node scripts/package-version.mjs)
            if [[ -n $(git status --porcelain) ]]; then
              git add .changeset js/package.json js/package-lock.json js/CHANGELOG.md rust/Cargo.toml rust/Cargo.lock rust/CHANGELOG.md python/pyproject.toml python/CHANGELOG.md
              git commit -m "$NEW_VERSION" -m "Release-Run: $GITHUB_RUN_ID"
              git push origin HEAD:main
            fi
          fi
          NEW_VERSION=$(node scripts/package-version.mjs)
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish-npm:
    name: Publish to npm
    needs: [release]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Check already published version
        id: registry
        run: node scripts/check-registry.mjs --registry npm

      - name: Install package dependencies
        if: steps.registry.outputs.published == 'false'
        run: npm ci
        working-directory: js

      - name: Publish to npm with provenance
        if: steps.registry.outputs.published == 'false'
        run: npm publish --provenance --access public
        working-directory: js

  publish-crates:
    name: Publish to crates.io
    needs: [release]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Check already published version
        id: registry
        run: node scripts/check-registry.mjs --registry crates-io

      - name: Setup Rust
        if: steps.registry.outputs.published == 'false'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the build
        if: steps.registry.outputs.published == 'false'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Authenticate with crates.io
        if: steps.registry.outputs.published == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        if: steps.registry.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
        working-directory: rust

  publish-pypi:
    name: Publish to PyPI
    needs: [release]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Check already published version
        id: registry
        run: node scripts/check-registry.mjs --registry pypi

      - name: Setup Python
        if: steps.registry.outputs.published == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build and check distributions
        if: steps.registry.outputs.published == 'false'
        run: |
          python -m pip install build twine
          python -m build python
          python -m twine check python/dist/*

      - name: Publish to PyPI using trusted publishing
        if: steps.registry.outputs.published == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
          skip-existing: true

  github-release:
    name: Create GitHub Release
    needs: [release, publish-npm, publish-crates, publish-pypi]
    if: always() && needs.release.result == 'success' && needs.publish-npm.result == 'success' && needs.publish-crates.result == 'success' && needs.publish-pypi.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: node scripts/create-github-release-python.mjs

      - name: Format GitHub release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: node scripts/format-github-release.mjs --release-version "$RELEASE_VERSION" --repository "$REPOSITORY" --commit-sha "$RELEASE_SHA"

  # Manual Changeset PR - creates a pull request with the changeset for review
  changeset-pr:
    name: Create Changeset PR
    if: github.event_name == 'workflow_dispatch' && inputs.release_mode == 'changeset-pr' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: npm install

      - name: Create changeset file
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
          DESCRIPTION: ${{ inputs.description }}
        run: node scripts/create-manual-changeset.mjs

      - name: Format changeset with Prettier
        run: |
          # Run Prettier on the changeset file to ensure it matches project style
          npx prettier --write ".changeset/*.md" || true

          echo "Formatted changeset files"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: add changeset for manual ${{ github.event.inputs.bump_type }} release"
          branch: changeset-manual-release-${{ github.run_id }}
          delete-branch: true
          title: "chore: manual ${{ github.event.inputs.bump_type }} release"
          body: |
            ## Manual Release Request

            This PR was created by a manual workflow trigger to prepare a **${{ github.event.inputs.bump_type }}** release.

            ### Release Details
            - **Type:** ${{ github.event.inputs.bump_type }}
            - **Description:** ${{ github.event.inputs.description || 'Manual release' }}
            - **Triggered by:** @${{ github.actor }}

            ### Next Steps
            1. Review the changeset in this PR
            2. Merge this PR to main
            3. The release workflow versions all three packages together
            4. npm, crates.io and PyPI publish through trusted publishing
