[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lino-rest-api"
version = "0.1.1"
description = "REST API framework using Links Notation (LINO) instead of JSON"
readme = "README.md"
requires-python = ">=3.13"
license = {file = "LICENSE"}
authors = [
    {name = "Link Foundation"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "links-notation>=0.20.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]
docs = [
    "pdoc>=15.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pdoc>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/link-foundation/lino-rest-api"
Repository = "https://github.com/link-foundation/lino-rest-api"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Run against the sources without requiring an editable install.
pythonpath = ["src"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py313"
# The vendored codec is synced verbatim from lino-objects-codec, see
# src/lino_rest_api/vendor/lino_objects_codec/VENDORED.md.
extend-exclude = ["src/lino_rest_api/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
